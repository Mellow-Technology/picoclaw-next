name: Container

# Builds the slim busybox image (docker/Dockerfile) for linux/amd64 and
# linux/arm64 and pushes it to GHCR. Pull requests build both platforms
# without pushing.
#
#   main      -> :main, :latest, :sha-<short>
#   v1.2.3    -> :1.2.3, :1.2, :sha-<short>

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - docker/Dockerfile
      - docker/entrypoint.sh
      - .dockerignore
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Dockerfile cross-compiles Go on the runner's own platform and its
      # final stage has no RUN steps, so arm64 needs no QEMU.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=picoclaw

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max
